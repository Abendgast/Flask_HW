{% extends 'base.html' %}
{% block title %}{{ post.title }}{% endblock %}
{% block content %}
  <h1>{{ post.title }}</h1>
  <p class="text-muted">{{ post.author }} • {{ post.posted.strftime('%Y-%m-%d %H:%M') }} • {{ post.category }}</p>
  <div>{{ post.content }}</div>
  <div class="mt-3">
    <a class="btn btn-primary" href="{{ url_for('posts.update_post', id=post.id) }}">Edit</a>
    <a class="btn btn-danger" href="{{ url_for('posts.delete_post', id=post.id) }}">Delete</a>
    <a class="btn btn-secondary" href="{{ url_for('posts.list_posts') }}">Back</a>
  </div>
{% endblock %}
